# Isolated Group12-v2 smoke/template; never mixed with old results.
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
group_id: 12
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 1
  memory_size: 6
  recent_exclude: 5
  use_latentmem: true
  retrieval_backend: draftmap_online
  group_runtime_mode: group12_v2
  group_sparse_ratio: 0.0
  q_sparse_ratio: 0.0
  local_kv_promotion_ratio: 0.2
cpu_historical_k_storage: bf16
cpu_historical_v_storage: bf16
gpu_local_k_storage: int8
gpu_local_v_storage: fp8_e4m3
gpu_historical_persistent: none
attention_compute: bf16
persistent_storage_mode: local_lowbit_cpu_history_v2
cache_ownership_version: LOCAL_LOWBIT_CPU_HISTORY_V2

sparse_scope: local_plus_retrieved_history
