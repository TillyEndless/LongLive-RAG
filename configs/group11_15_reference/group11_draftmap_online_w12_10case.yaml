# Group 11 canonical W12 run; preserves the existing LongLive latent-memory settings.
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B

model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 1
  memory_size: 6
  recent_exclude: 5
  use_latentmem: true
  compression_method: "ae"
  ae_ckpt: "checkpoints/ae_latent_mem.pt"
  retrieval_backend: "draftmap_online"

generator_ckpt: checkpoints/longlive_base.pt
lora_ckpt: checkpoints/longlive_lora.pt

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  verbose: false

data_path: /home/zju/work/zxl/LongLive-RAG-profile/prompts10.txt
output_folder: /home/zju/work/zxl/anemoi_native_draftattention_5090/results/draftmap_rag_online_w12_10case
inference_iter: -1
skip_existing: true
num_output_frames: 120
use_ema: false
seed: 0
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0
